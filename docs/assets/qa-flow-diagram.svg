<!-- Source of docs/assets/qa-flow-diagram.png (README flow diagram). Uses local fonts
     (Bahnschrift, Cascadia Mono/Consolas) — render with Chromium at 2x, do not embed this SVG directly. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" opacity="0.05"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7D8590"/>
    </marker>
    <style>
      .head { font-family: Bahnschrift, "Segoe UI", Arial, sans-serif; font-weight: 700; }
      .mono { font-family: "Cascadia Mono", Consolas, "Courier New", monospace; }
      .sans { font-family: Bahnschrift, "Segoe UI", Arial, sans-serif; }
      .white { fill: #ECEEF1; } .muted { fill: #7D8590; } .lime { fill: #C6F45B; } .amber { fill: #F5B83D; }
      .panel { fill: #14171C; stroke: #262B33; stroke-width: 1.5; }
      .label { font-size: 17px; letter-spacing: 2.5px; font-weight: 700; }
      .boxtitle { font-size: 24px; letter-spacing: 2px; font-weight: 700; }
      .sub { font-size: 22px; }
      .flow { stroke: #7D8590; stroke-width: 2; fill: none; }
      .tick { stroke: #C6F45B; stroke-width: 2; stroke-dasharray: 4 6; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#0B0D10"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>

  <!-- header -->
  <rect x="60" y="48" width="196" height="40" rx="20" fill="none" stroke="#C6F45B" stroke-width="1.5"/>
  <circle cx="84" cy="68" r="5" fill="#C6F45B"/>
  <text x="100" y="74" class="mono lime" font-size="17" letter-spacing="2">QA-FLOW 2.0</text>
  <text x="1540" y="74" class="mono muted" font-size="17" text-anchor="end">/qa-flow:manual-test TICKET-1234</text>
  <text x="60" y="172" class="head white" font-size="60">From ticket to a verdict <tspan class="lime">you can trust.</tspan></text>

  <!-- skill groups -->
  <text x="60" y="246" class="mono muted label">SKILL</text>
  <text x="138" y="246" class="mono lime" font-size="20">create-test-plan-scenarios</text>
  <line x1="60" y1="262" x2="500" y2="262" stroke="#262B33" stroke-width="1.5"/>
  <text x="560" y="246" class="mono muted label">SKILL</text>
  <text x="638" y="246" class="mono lime" font-size="20">manual-test</text>
  <line x1="560" y1="262" x2="1140" y2="262" stroke="#262B33" stroke-width="1.5"/>
  <text x="1200" y="246" class="mono muted label">SKILL</text>
  <text x="1278" y="246" class="mono lime" font-size="20">file-bug-ticket</text>
  <line x1="1200" y1="262" x2="1540" y2="262" stroke="#262B33" stroke-width="1.5"/>

  <!-- col 1 -->
  <rect x="60" y="290" width="440" height="120" rx="14" class="panel"/>
  <text x="88" y="334" class="mono white boxtitle">TICKET</text>
  <text x="88" y="374" class="sans muted sub">ACs · comments · linked tickets &amp; docs</text>
  <line x1="280" y1="410" x2="280" y2="466" class="flow" marker-end="url(#arrow)"/>
  <rect x="60" y="470" width="440" height="120" rx="14" class="panel"/>
  <text x="88" y="514" class="mono white boxtitle">TEST PLAN</text>
  <text x="88" y="552" class="sans muted sub">atomic scenarios · regression</text>
  <text x="88" y="578" class="sans muted sub">edge cases · self-review</text>
  <path d="M500 530 H530 V350 H556" class="flow" marker-end="url(#arrow)"/>

  <!-- col 2 -->
  <rect x="560" y="290" width="580" height="120" rx="14" class="panel"/>
  <text x="588" y="334" class="mono white boxtitle">EXECUTOR</text>
  <rect x="1022" y="310" width="96" height="32" rx="6" fill="#C6F45B" fill-opacity="0.14"/>
  <text x="1070" y="332" class="mono lime" font-size="17" font-weight="700" letter-spacing="1.5" text-anchor="middle">PASS</text>
  <text x="588" y="374" class="sans muted sub">real browser · Playwright · a screenshot per step</text>

  <line x1="560" y1="440" x2="1140" y2="440" stroke="#F5B83D" stroke-width="1.5" stroke-dasharray="8 8"/>
  <line x1="850" y1="410" x2="850" y2="466" class="flow" marker-end="url(#arrow)"/>
  <rect x="585" y="423" width="530" height="34" rx="17" fill="#0B0D10" stroke="#F5B83D" stroke-width="1.5"/>
  <text x="850" y="446" class="mono amber" font-size="17" letter-spacing="1.5" text-anchor="middle">TRUST BOUNDARY · fresh context · read-only</text>

  <rect x="560" y="470" width="580" height="120" rx="14" fill="#14171C" stroke="#C6F45B" stroke-width="2.5"/>
  <text x="588" y="514" class="mono lime boxtitle">INDEPENDENT REVIEWER</text>
  <rect x="948" y="490" width="170" height="32" rx="6" fill="#F5B83D" fill-opacity="0.16"/>
  <text x="1033" y="512" class="mono amber" font-size="17" font-weight="700" letter-spacing="1" text-anchor="middle">INCONCLUSIVE</text>
  <text x="588" y="552" class="sans white sub">opens the evidence itself</text>
  <text x="588" y="578" class="sans white sub">re-checks every PASS · flags duplicate shots</text>
  <line x1="850" y1="590" x2="850" y2="646" class="flow" marker-end="url(#arrow)"/>

  <rect x="560" y="650" width="580" height="120" rx="14" class="panel"/>
  <text x="588" y="694" class="mono white boxtitle">SEVERITY GATE</text>
  <text x="588" y="732" class="sans muted sub">blocking → back to development</text>
  <text x="588" y="758" class="sans muted sub">everything else → a note or a Low bug</text>
  <line x1="1140" y1="710" x2="1196" y2="710" class="flow" marker-end="url(#arrow)"/>

  <!-- col 3 -->
  <rect x="1200" y="290" width="340" height="300" rx="14" class="panel"/>
  <text x="1228" y="334" class="mono muted label">PACKAGED AGENTS</text>
  <line x1="1200" y1="354" x2="1540" y2="354" stroke="#262B33" stroke-width="1.5"/>
  <circle cx="1234" cy="392" r="5" fill="#C6F45B"/>
  <text x="1250" y="398" class="mono white" font-size="19">qa-test-executor</text>
  <text x="1250" y="424" class="sans muted" font-size="19">runs the browser</text>
  <circle cx="1234" cy="462" r="5" fill="#C6F45B"/>
  <text x="1250" y="468" class="mono white" font-size="19">qa-evidence-reviewer</text>
  <text x="1250" y="494" class="sans muted" font-size="19">read-only, never a fork</text>
  <circle cx="1234" cy="524" r="5" fill="#F5B83D"/>
  <text x="1250" y="530" class="mono white" font-size="19">role guard</text>
  <text x="1250" y="556" class="sans muted" font-size="19">no tracker writes, no commits</text>
  <text x="1250" y="578" class="sans muted" font-size="16">Claude Code hook · OpenCode rules</text>

  <rect x="1200" y="650" width="340" height="120" rx="14" class="panel"/>
  <text x="1228" y="694" class="mono white boxtitle">BUG TICKET</text>
  <text x="1228" y="732" class="sans muted sub">one per root cause</text>
  <text x="1228" y="758" class="sans muted sub">evidence attached</text>

  <!-- human in the loop -->
  <text x="60" y="826" class="mono white label">HUMAN IN THE LOOP</text>
  <line x1="60" y1="850" x2="1540" y2="850" stroke="#C6F45B" stroke-width="2.5"/>
  <line x1="440" y1="590" x2="440" y2="838" class="tick"/>
  <line x1="850" y1="770" x2="850" y2="838" class="tick"/>
  <line x1="1370" y1="770" x2="1370" y2="838" class="tick"/>

  <rect x="428" y="838" width="24" height="24" rx="5" fill="#C6F45B"/>
  <path d="M433 850 l5 5 l9 -11" fill="none" stroke="#0B0D10" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="440" y="900" class="sans white" font-size="22" text-anchor="middle">you approve the plan</text>

  <rect x="838" y="838" width="24" height="24" rx="5" fill="#C6F45B"/>
  <path d="M843 850 l5 5 l9 -11" fill="none" stroke="#0B0D10" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="850" y="900" class="sans white" font-size="22" text-anchor="middle">you validate the evidence</text>

  <rect x="1359" y="839" width="22" height="22" rx="5" fill="#0B0D10" stroke="#7D8590" stroke-width="2"/>
  <text x="1370" y="900" class="sans white" font-size="22" text-anchor="middle">OK to publish</text>
  <rect x="1290" y="912" width="160" height="32" rx="6" fill="#ECEEF1" fill-opacity="0.08"/>
  <text x="1370" y="934" class="mono white" font-size="17" font-weight="700" letter-spacing="1.5" text-anchor="middle">AWAITING YOU</text>

  <!-- footer -->
  <text x="60" y="972" class="mono muted" font-size="19">Claude Code · OpenCode · Codex (experimental) · any Agent Skills harness</text>
</svg>
